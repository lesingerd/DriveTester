name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore DriveTester.sln

    - name: Build Solution
      run: dotnet build DriveTester.sln --configuration Release --no-restore

    - name: Run Unit & Integration Tests
      run: dotnet test DriveTester.sln --configuration Release --no-build --verbosity normal
